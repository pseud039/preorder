# Nginx configuration for predine.in
# Place this file in /etc/nginx/sites-available/ and symlink to /etc/nginx/sites-enabled/

# Upstream definitions
upstream api_backend {
    server localhost:8000;
    keepalive 32;
}

upstream admin_backend {
    server localhost:3001;
    keepalive 32;
}

upstream client_backend {
    server localhost:3000;
    keepalive 32;
}

# API Server - api.predine.in
server {
    listen 80;
    listen [::]:80;
    server_name api.predine.in;

    client_max_body_size 50M;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Logging
    access_log /var/log/nginx/api.predine.in.access.log;
    error_log /var/log/nginx/api.predine.in.error.log;
}

# Admin Panel - admin.predine.in
server {
    listen 80;
    listen [::]:80;
    server_name admin.predine.in;

    client_max_body_size 50M;

    location / {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        
        # WebSocket support (for Next.js hot reload and real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
    }

    # Logging
    access_log /var/log/nginx/admin.predine.in.access.log;
    error_log /var/log/nginx/admin.predine.in.error.log;
}

# Client App - predine.in
server {
    listen 80;
    listen [::]:80;
    server_name predine.in www.predine.in;

    client_max_body_size 50M;

    # Redirect www to non-www
    if ($host = www.predine.in) {
        return 301 http://predine.in$request_uri;
    }

    location / {
        proxy_pass http://client_backend;
        proxy_http_version 1.1;
        
        # WebSocket support (for Next.js hot reload and real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
    }

    # Logging
    access_log /var/log/nginx/predine.in.access.log;
    error_log /var/log/nginx/predine.in.error.log;
}

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: preorder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-preorder}
    volumes:
      - db-data:/var/lib/postgresql/data
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - preorder-network

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: preorder-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-preorder}
      MULTER_PATH: /usr/src/app/public/temp
      PORT: 8000
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - preorder-network
    volumes:
      - server-temp:/usr/src/app/public/temp

  # Admin Panel (Next.js)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: preorder-admin
    restart: unless-stopped
    env_file:
      - ./admin/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on: 
      - server
    networks:
      - preorder-network

  # Client App (Next.js)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: preorder-client
    restart: unless-stopped
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - server
    networks:
      - preorder-network

volumes:
  db-data:
    driver: local
  server-temp:
    driver: local

networks:
  preorder-network:
    driver: bridge
